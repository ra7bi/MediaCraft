[package]
name = "mediacraft"
version = "0.1.0"
description = "Free open source YouTube downloader for Windows, built on yt-dlp and FFmpeg"
authors = ["ra7bi"]
license = "MIT"
repository = "https://github.com/ra7bi/MediaCraft"
edition = "2021"
rust-version = "1.87"

[lib]
name = "mediacraft_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs4 = { version = "0.13", default-features = false, features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
